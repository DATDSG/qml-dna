name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package + dev/quantum extras
        run: |
          pip install -e ".[dev,quantum,api]"

      - name: Lint
        run: |
          ruff check src api tests
          black --check src api tests

      - name: Train classical models (needed for API integration tests)
        run: python scripts/build_classical_models.py

      - name: Run tests (excluding slow quantum-training regressions)
        run: pytest -m "not slow" -q
