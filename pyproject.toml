[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qmldna"
version = "0.1.0"
description = "Quantum vs classical DNA sequence classification: feature engineering, classical SVM, quantum kernel/VQC models, and reporting, extracted from the qml-dna research notebooks into a reusable package."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "biopython>=1.83",
    "joblib>=1.3",
]

[project.optional-dependencies]
quantum = ["pennylane>=0.34", "pennylane-lightning>=0.34"]
reporting = ["python-docx>=0.8", "reportlab>=3.6", "matplotlib>=3.8"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
web = ["streamlit>=1.32", "plotly>=5.19"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4", "black>=24.3", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: real circuit-simulation training, minutes to run (deselect with -m 'not slow')"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.black]
line-length = 120
target-version = ["py310"]
