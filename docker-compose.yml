services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./results:/app/results:ro
      - ./data:/app/data:ro
      - ./scripts:/app/scripts

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "8501:8501"
    environment:
      - QMLDNA_API_URL=http://api:8000
    depends_on:
      - api
